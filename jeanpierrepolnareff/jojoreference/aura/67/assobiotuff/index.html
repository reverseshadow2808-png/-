<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recado para o Polnareff</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #ff70a6; margin-bottom: 10px; }
        p { font-size: 1.1em; line-height: 1.5; }
        .jojo-ref {
            font-weight: bold;
            color: #ffd166;
            margin-top: 15px;
            margin-bottom: 20px;
            display: block;
        }
        iframe {
            border-radius: 10px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Aviso para o Polnareff!</h1>
        <p>Ei, Jean Pierre, enfia esse Silver Chariot no cu e <strong>se fode</strong>!</p>
        <span class="jojo-ref">Eu te odeio filho da puta</span>
        
        <!-- Botão oficial incorporado do MyInstants -->
        <iframe width="110" height="200" src="https://www.myinstants.com/instant/silver-chariot-95459/embed/" frameborder="0" scrolling="no"></iframe>
    </div>
</body>
</html>
