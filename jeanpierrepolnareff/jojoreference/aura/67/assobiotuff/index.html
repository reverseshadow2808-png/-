<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recado para o Polnareff</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 400px;
            cursor: pointer;
        }
        h1 { color: #ff70a6; margin-bottom: 10px; }
        p { font-size: 1.1em; line-height: 1.5; }
        .jojo-ref {
            font-weight: bold;
            color: #ffd166;
            margin-top: 15px;
            display: block;
        }
        .btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #ff70a6;
            border: none;
            color: white;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card" onclick="tocarSom()">
        <h1>Aviso para o Polnareff!</h1>
        <p>Ei, Jean Pierre, enfia esse Silver Chariot no cu e <strong>se fode</strong>!</p>
        <span class="jojo-ref">Eu te odeio, se mata polnareff filho da puta</span>
        <button class="btn">Botão Super Secreto</button>
    </div>

    <!-- Link corrigido para o arquivo de áudio direto -->
    <audio id="jojo-sound" src="https://www.myinstants.com/media/sounds/silver-chariot.mp3"></audio>

    <script>
        function tocarSom() {
            document.getElementById('jojo-sound').play();
        }
    </script>
</body>
</html>
