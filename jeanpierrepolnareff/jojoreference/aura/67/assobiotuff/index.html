<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recado para o Polnareff</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 400px;
        }
        h1 { color: #ff70a6; margin-bottom: 10px; }
        p { font-size: 1.1em; line-height: 1.5; }
        .jojo-ref {
            font-weight: bold;
            color: #ffd166;
            margin-top: 15px;
            display: block;
        }
        .btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #ff70a6;
            border: none;
            color: white;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Aviso para o Polnareff!</h1>
        <p>Ei, Jean Pierre, enfia esse Silver Chariot no cu e <strong>se fode</strong>!</p>
        <span class="jojo-ref">Eu te odeio</span>
        <button class="btn" onclick="tocarSom()">Botão Super Secreto 🔊</button>
    </div>

    <!-- Áudio do efeito sonoro do Za Warudo/JoJo (Link direto funcional) -->
    <audio id="jojo-sound" src="https://assets.mixkit.co/active_storage/sfx/2874/2874-preview.mp3" preload="auto"></audio>

    <script>
        function tocarSom() {
            var audio = document.getElementById('jojo-sound');
            audio.currentTime = 0; // Reinicia o som se for clicado novamente
            audio.play().catch(function(error) {
                console.log("Erro ao reproduzir o áudio:", error);
            });
        }
    </script>
</body>
</html>
