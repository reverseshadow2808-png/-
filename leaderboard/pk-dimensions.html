<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem Leaderboard - DDCraft</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="image_129a6c.jpg">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    /* Animação suave de entrada */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Animação de flutuação para o ícone */
    @keyframes float {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-10px) rotate(-3deg);
      }
    }

    /* Animação do pulso no fundo do ícone */
    @keyframes pulseGlow {
      0%, 100% {
        opacity: 0.2;
        transform: scale(0.95);
      }
      50% {
        opacity: 0.5;
        transform: scale(1.1);
      }
    }

    .animate-fade-in {
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-float {
      animation: float 4s ease-in-out infinite;
    }

    .animate-pulse-glow {
      animation: pulseGlow 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-slate-950">

  <!-- Background decorativo -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-cyan-600/10 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-10 left-1/3 w-[400px] h-[300px] bg-blue-600/10 rounded-full blur-[100px]"></div>
  </div>

  <!-- Header -->
  <header class="relative z-10 w-full py-4 px-6 md:px-12 flex justify-between items-center bg-slate-900/60 backdrop-blur-xl border-b border-slate-800/80 shadow-lg">
    <a href="/leaderboard" class="flex items-center transition hover:opacity-85 active:scale-95">
      <img src="image_129a6c.jpg" alt="DDCraft Logo" class="h-10 md:h-12 w-auto object-contain drop-shadow-[0_0_12px_rgba(6,182,212,0.3)]">
    </a>
    
    <a href="/leaderboard" class="group text-xs md:text-sm font-semibold text-slate-400 hover:text-white bg-slate-800/50 hover:bg-slate-800 border border-slate-700/60 hover:border-slate-600 px-4 py-2 rounded-xl transition duration-200 flex items-center gap-2 backdrop-blur-md">
      <i class="fa-solid fa-arrow-left text-xs transition-transform group-hover:-translate-x-1"></i>
      Voltar às Leaderboards
    </a>
  </header>

  <!-- Conteúdo Principal Centralizado -->
  <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-4 py-16 animate-fade-in text-center">
    
    <!-- Ícone Animado com Efeito Neon -->
    <div class="relative mb-8 flex items-center justify-center">
      <div class="absolute w-32 h-32 bg-cyan-500/20 rounded-full blur-2xl animate-pulse-glow"></div>
      
      <div class="animate-float relative z-10 w-24 h-24 rounded-3xl bg-slate-900/80 border border-slate-700/80 flex items-center justify-center shadow-2xl backdrop-blur-xl group">
        <i class="fa-solid fa-trophy-slash text-4xl text-slate-500 group-hover:text-cyan-400 transition-colors duration-300"></i>
      </div>
    </div>

    <!-- Mensagens -->
    <span class="px-3 py-1 rounded-full bg-slate-800/80 border border-slate-700/80 text-slate-400 text-xs font-mono font-medium mb-3 shadow-inner">
      STATUS: INDISPONÍVEL
    </span>

    <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight mb-3">
      Esse modo não tem <span class="bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">leaderboard</span> :/
    </h1>

    <p class="text-slate-400 text-sm md:text-base max-w-md mx-auto leading-relaxed mb-8">
      Os tempos ou pontuações desta modalidade não estão sendo registrados no momento ou ainda estão em fase de testes pela equipe.
    </p>

    <!-- Botões de Ação -->
    <div class="flex flex-col sm:flex-row items-center gap-3">
      <a href="/leaderboard" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm transition duration-200 shadow-lg shadow-cyan-500/20 active:scale-95 flex items-center justify-center gap-2">
        <i class="fa-solid fa-list-ol"></i>
        Ver Outros Rankings
      </a>

      <a href="/" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 text-slate-300 hover:text-white font-semibold text-sm transition duration-200 active:scale-95 flex items-center justify-center gap-2">
        <i class="fa-solid fa-house text-xs"></i>
        Página Inicial
      </a>
    </div>

  </main>

  <!-- Footer Simples -->
  <footer class="relative z-10 py-6 text-center text-xs text-slate-600 border-t border-slate-900">
    <p>&copy; DDCraft Network - Todos os direitos reservados.</p>
  </footer>

</body>
</html>
